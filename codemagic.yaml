workflows:
  ios-testflight:
    name: PrepWise iOS - TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: "PrepWise App Store Connect"

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.prepwise.app
      node: 22
      xcode: latest
      vars:
        APP_STORE_VERSION: 1.0.3

    scripts:
      - name: Install JavaScript dependencies
        script: npm ci

      - name: Build web app and sync iOS project
        script: |
          npm run build
          npx cap sync ios

      - name: Run automated checks
        script: |
          npm run check
          npm run typecheck
          npm test

      - name: Configure App Store signing
        script: xcode-project use-profiles

      - name: Set App Store version and build number
        script: |
          cd "$CM_BUILD_DIR/ios/App"
          xcrun agvtool new-marketing-version "$APP_STORE_VERSION"
          xcrun agvtool new-version -all "$BUILD_NUMBER"

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/ios/App/App.xcodeproj" \
            --scheme App

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
